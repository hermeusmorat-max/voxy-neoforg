name: Build Voxy
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mc_1211
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fix gradlew
        run: |
          ls -la gradlew
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: voxy-neoforge-jar
          path: build/libs/*.jar
